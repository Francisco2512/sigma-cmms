spring.application.name=sigma-cmms

# Secretos locales en backend/.env (ignorado por git). Ver .env.example
spring.config.import=optional:file:.env[.properties]

# Base de datos
spring.datasource.url=${SIGMA_DB_URL:jdbc:mysql://localhost:3306/sigma_cmms}
spring.datasource.username=${SIGMA_DB_USER:sigma}
spring.datasource.password=${SIGMA_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=sigma-pool

# JPA: Flyway es duenio del esquema; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Web y errores (RFC 7807, sin trazas al cliente)
server.port=8080
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.max-http-form-post-size=1MB

# Observabilidad
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# SIGMA
sigma.jwt.secret=${SIGMA_JWT_SECRET:}
sigma.jwt.expiration-minutes=120
sigma.cors.allowed-origins=${SIGMA_CORS_ORIGINS:http://localhost:4200}
sigma.seed.enabled=${SIGMA_SEED_ENABLED:true}
sigma.seed.demo-password=${SIGMA_DEMO_PASSWORD:}
sigma.preventive.cron=0 0 6 * * *
sigma.security.max-login-attempts=5
sigma.security.lockout-minutes=5

# Paginacion: tamanio maximo de pagina
spring.data.web.pageable.max-page-size=100
