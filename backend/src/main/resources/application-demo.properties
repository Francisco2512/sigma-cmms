# Perfil de demostracion: base en memoria, sin instalar MySQL.
# El perfil por defecto usa MySQL con migraciones Flyway.
spring.datasource.url=jdbc:h2:mem:sigma;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
