<div class="login-page">
  <section class="hero">
    <span class="mark">Σ</span>
    <h1>SIGMA</h1>
    <p>Sistema Integral de Gestión de Mantenimiento de Activos</p>
    <ul>
      <li>Órdenes de trabajo del reporte al cierre</li>
      <li>Preventivos generados automáticamente</li>
      <li>MTBF, MTTR y disponibilidad al día</li>
    </ul>
  </section>

  <form class="panel" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h2>Iniciar sesión</h2>
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" class="input" formControlName="username" autocomplete="username" data-testid="login-username" />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" class="input" formControlName="password" autocomplete="current-password"
             data-testid="login-password" />
    </div>
    @if (error()) {
      <p class="login-error" role="alert" data-testid="login-error">{{ error() }}</p>
    }
    <button type="submit" class="btn btn-primary btn-lg" [disabled]="loading()" data-testid="login-submit">
      {{ loading() ? 'Validando…' : 'Entrar' }}
    </button>
  </form>
</div>
